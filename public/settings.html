<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings · Mino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Instrument+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body class="scroll">
<header class="bar">
  <a class="brand" href="/">Mino</a>
  <div class="meta"></div>
  <a class="ghost mono" href="/">Back to chat</a>
</header>
<main class="settings">
  <h1>Settings</h1>
  <form id="llm" autocomplete="off">
    <label class="field">
      <span class="mono label">LLM provider</span>
      <select id="provider"></select>
    </label>
    <label class="field">
      <span class="mono label">Model</span>
      <select id="model"></select>
    </label>
    <label class="field">
      <span class="mono label">API key</span>
      <input id="key" type="password" spellcheck="false" autocomplete="off">
    </label>
    <div class="key-line">
      <span class="mono provider-status" id="status"></span>
      <a id="get-key" target="_blank" rel="noopener noreferrer"></a>
    </div>
    <p class="form-message" id="message" role="status"></p>
    <div class="form-actions">
      <button class="primary" id="save" type="submit">Save changes</button>
      <button class="text-button" id="remove" type="button" hidden>Remove key</button>
    </div>
  </form>
  <p class="aside" id="usage"></p>
  <div id="warnings"></div>
</main>
<script src="/js/settings.js"></script>
</body>
</html>
