<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Instrument+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<aside id="chats" aria-label="Chats">
  <div class="mono chats-title">Chats</div>
  <div id="chat-list"></div>
</aside>
<div id="chats-backdrop"></div>
<header class="bar">
  <button class="round" id="chats-toggle" type="button" aria-label="Show or hide chats" title="Chats"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9.5 4v16"/></svg></button>
  <a class="brand" href="/">Mino</a>
  <div class="meta">
    <span class="mono" id="clock"></span>
  </div>
  <button class="ghost mono" id="new" type="button">New chat</button>
  <a class="round" id="gear" href="/settings" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1.08-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1.08 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.08a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.08a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></a>
</header>
<main id="log"><div class="inner" id="messages"></div></main>
<form id="form">
  <div class="composer" id="composer">
    <textarea id="input" rows="1" placeholder="Ask anything" aria-label="Message"></textarea>
    <div class="wave" id="wave" aria-hidden="true"></div>
    <div class="controls">
      <select class="mono model" id="model" aria-label="Model" hidden></select>
      <div class="actions">
        <button class="round" id="mic" type="button" aria-label="Speak your message" hidden></button>
        <button class="round primary-round" id="send" type="submit" aria-label="Send"></button>
      </div>
    </div>
  </div>
</form>
<script src="/vendor/marked.js"></script>
<script src="/vendor/purify.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const messages = $("messages"), log = $("log"), input = $("input"), send = $("send");
const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;

const SETUP_COMMAND = 'echo "GEMINI_API_KEY=your_key_here" > .env && npm run dev';

const readThread = () => { try { return localStorage.getItem("threadId"); } catch { return null; } };
const writeThread = (id) => { try { id ? localStorage.setItem("threadId", id) : localStorage.removeItem("threadId"); } catch {} };

let threadId = readThread();
let configured = true;
let lastDay = null;

const format = (options) => new Intl.DateTimeFormat("en-GB", { timeZone: timezone, ...options });
const dayFormat = format({ weekday: "short", day: "numeric", month: "short", year: "numeric" });
const timeFormat = format({ hour: "2-digit", minute: "2-digit", hourCycle: "h23" });
const clockFormat = format({ weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit", hourCycle: "h23" });

function dayLabel(at) {
  const day = dayFormat.format(at), now = Date.now();
  if (day === dayFormat.format(now)) return "Today";
  if (day === dayFormat.format(now - 86400000)) return "Yesterday";
  return day;
}

function tickClock() { $("clock").textContent = clockFormat.format(Date.now()) + " · " + timezone; }

const nearBottom = () => log.scrollHeight - log.scrollTop - log.clientHeight < 120;
const toBottom = () => { log.scrollTop = log.scrollHeight; };
const html = (text) => DOMPurify.sanitize(marked.parse(text));

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function addDayIfNew(at) {
  const key = dayFormat.format(at);
  if (key === lastDay) return;
  lastDay = key;
  messages.append(el("div", "day mono", dayLabel(at)));
}

function addUser(text, at) {
  document.body.classList.remove("is-empty");
  addDayIfNew(at);
  const wrap = el("div", "msg mine");
  wrap.append(el("div", "bubble", text), el("div", "stamp mono", timeFormat.format(at)));
  messages.append(wrap);
}

function addAnswer() {
  const wrap = el("div", "msg");
  const status = el("div", "status mono");
  const answer = el("div", "answer"), sources = el("div", "sources");
  wrap.append(status, answer, sources);
  messages.append(wrap);
  return { wrap, status, answer, sources };
}

function renderSources(node, list) {
  node.replaceChildren();
  const cited = list.filter((s) => s.cited);
  (cited.length ? cited : list).slice(0, 8).forEach((s, i) => {
    let url;
    try { url = new URL(s.url); } catch { return; }
    if (!/^https?:$/.test(url.protocol)) return;
    const a = el("a", "mono");
    a.href = url.href; a.target = "_blank"; a.rel = "noopener noreferrer"; a.title = s.title || url.href;
    const name = url.hostname.includes("vertexaisearch") ? (s.title || "source") : url.hostname.replace(/^www\./, "");
    a.textContent = String(i + 1).padStart(2, "0") + " " + name;
    node.append(a);
  });
}

const svg = (body) => `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${body}</svg>`;
const ICONS = {
  send: svg('<path d="M12 19V5M5.5 11.5 12 5l6.5 6.5"/>'),
  stop: svg('<rect x="7" y="7" width="10" height="10" rx="1.5" fill="currentColor"/>'),
  mic: svg('<rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>'),
  check: svg('<path d="m5 12.5 4.5 4.5L19 7.5"/>'),
  copy: svg('<rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5.5 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v.5"/>'),
  speaker: svg('<path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"/>'),
  pin: svg('<path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/>'),
  trash: svg('<path d="M4 7h16M9 7V4.5A1.5 1.5 0 0 1 10.5 3h3A1.5 1.5 0 0 1 15 4.5V7M6 7l1 12.5A1.5 1.5 0 0 0 8.5 21h7a1.5 1.5 0 0 0 1.5-1.5L18 7"/>'),
};

let busyShown = null;
function setBusy(busy) {
  if (busy !== busyShown) {
    busyShown = busy;
    send.innerHTML = busy ? ICONS.stop : ICONS.send;
    send.setAttribute("aria-label", busy ? "Stop" : "Send");
  }
  send.disabled = !configured || (!busy && !input.value.trim());
}

const composer = $("composer");
function updateComposer() {
  composer.classList.toggle("expanded", configured && (composer.contains(document.activeElement) || input.value !== ""));
}
function sizeInput() {
  input.style.height = "24px";
  input.style.height = Math.min(input.scrollHeight, 168) + "px";
}
composer.addEventListener("focusin", updateComposer);
composer.addEventListener("focusout", () => setTimeout(updateComposer));

// Dictation, using the browser's own speech recognition.
const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
const mic = $("mic");
let listening = null;
$("wave").replaceChildren(...Array.from({ length: 120 }, (_, i) => {
  const bar = el("i");
  bar.style.animationDelay = `${-((i * 7) % 11) / 10}s`;
  bar.style.animationDuration = `${0.7 + ((i * 5) % 7) / 10}s`;
  return bar;
}));

function endListening() {
  listening = null;
  composer.classList.remove("listening");
  mic.innerHTML = ICONS.mic;
  mic.setAttribute("aria-label", "Speak your message");
  sizeInput();
  setBusy(Boolean(active));
  input.focus();
  updateComposer();
}

function startListening() {
  const session = new Recognition();
  const base = input.value.trim();
  session.continuous = true;
  session.interimResults = true;
  session.lang = navigator.language || "en-US";
  session.onresult = (e) => {
    const said = Array.from(e.results, (r) => r[0].transcript).join("");
    input.value = base ? base + " " + said.trim() : said.trim();
  };
  session.onerror = (e) => {
    if (e.error === "not-allowed" || e.error === "service-not-allowed") {
      mic.hidden = true;
      input.placeholder = "Microphone access is blocked";
    }
  };
  session.onend = () => { if (listening === session) endListening(); };
  listening = session;
  composer.classList.add("listening");
  mic.innerHTML = ICONS.check;
  mic.setAttribute("aria-label", "Finish speaking");
  session.start();
}

if (Recognition) {
  mic.hidden = false;
  mic.innerHTML = ICONS.mic;
  mic.addEventListener("click", () => { if (listening) listening.stop(); else startListening(); });
}

// Read aloud, using the browser's own voices.
const synth = window.speechSynthesis;
let speaking = null;

function stopSpeaking() {
  if (!speaking) return;
  speaking.classList.remove("on");
  speaking = null;
  synth.cancel();
}

function speak(text, button) {
  if (speaking === button) { stopSpeaking(); return; }
  stopSpeaking();
  speaking = button;
  button.classList.add("on");
  // Long utterances get cut off by some voices, so sentences are queued in short pieces.
  const pieces = (text.match(/[^.!?\n]+[.!?]*\s*/g) || [text]).reduce((all, sentence) => {
    if (all.length && all.at(-1).length + sentence.length < 220) all[all.length - 1] += sentence;
    else all.push(sentence);
    return all;
  }, []);
  pieces.forEach((piece, i) => {
    const utterance = new SpeechSynthesisUtterance(piece);
    if (i === pieces.length - 1) utterance.onend = () => {
      if (speaking === button) { button.classList.remove("on"); speaking = null; }
    };
    synth.speak(utterance);
  });
}

function toolButton(icon, label) {
  const button = el("button", "round");
  button.type = "button";
  button.innerHTML = icon;
  button.setAttribute("aria-label", label);
  button.title = label;
  return button;
}

function addAnswerTools(view, text) {
  const tools = el("div", "answer-tools");
  const copy = toolButton(ICONS.copy, "Copy");
  copy.addEventListener("click", () => {
    copyText(text).then(() => {
      copy.innerHTML = ICONS.check;
      copy.title = "Copied";
      setTimeout(() => { copy.innerHTML = ICONS.copy; copy.title = "Copy"; }, 1500);
    }).catch(() => {});
  });
  tools.append(copy);
  if (synth) {
    const read = toolButton(ICONS.speaker, "Read aloud");
    read.addEventListener("click", () => speak(view.answer.innerText, read));
    tools.append(read);
  }
  view.wrap.append(tools);
}

let typing = 0;

/** Types the title one letter at a time. Screen readers get the whole text at once. */
function typeTitle(node, text) {
  const run = ++typing;
  node.setAttribute("aria-label", text);
  const shown = el("span");
  shown.setAttribute("aria-hidden", "true");
  const caret = el("span", "caret");
  caret.setAttribute("aria-hidden", "true");
  node.replaceChildren(shown, caret);
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) { shown.textContent = text; return; }
  let i = 0;
  const step = () => {
    if (run !== typing) return;
    shown.textContent = text.slice(0, ++i);
    if (i < text.length) setTimeout(step, 70);
  };
  setTimeout(step, 200);
}

function showEmpty() {
  lastDay = null;
  messages.replaceChildren();
  const hero = el("section", configured ? "hero centered" : "hero compact");
  const title = el("h1");
  hero.append(title);
  if (configured) {
    document.body.classList.add("is-empty");
    typeTitle(title, "Ask anything.");
  } else {
    document.body.classList.remove("is-empty");
    title.textContent = "Ask anything.";
  }

  if (!configured) hero.append(setupCard());
  messages.append(hero);
}

function copyText(text) {
  if (navigator.clipboard) return navigator.clipboard.writeText(text);
  const area = el("textarea");
  area.value = text;
  document.body.append(area);
  area.select();
  document.execCommand("copy");
  area.remove();
  return Promise.resolve();
}

function setupCard() {
  const card = el("div", "setup");
  card.append(el("div", "mono", "One step left"), el("h2", "", "API key not configured"));
  card.append(el("div", "", "Mino runs on a Gemini, Claude or OpenAI key. One is enough."));
  const add = el("a", "primary", "Add API key");
  add.href = "/settings";
  card.append(add, el("div", "mono or", "Or press Ctrl+C in your terminal and run"));

  const box = el("div", "command");
  const copy = el("button", "mono copy", "Copy");
  copy.type = "button";
  copy.addEventListener("click", () => {
    copyText(SETUP_COMMAND).then(() => {
      copy.textContent = "Copied";
      setTimeout(() => { copy.textContent = "Copy"; }, 1600);
    }).catch(() => { copy.textContent = "Press Cmd+C"; });
  });
  box.append(el("code", "", SETUP_COMMAND), copy);
  card.append(box);

  const other = el("p", "aside");
  other.append("Using Claude or OpenAI? Swap in ", el("code", "", "ANTHROPIC_API_KEY"), " or ", el("code", "", "OPENAI_API_KEY"), ".");
  card.append(other);
  for (const warning of statusWarnings) card.append(el("p", "warn", warning));
  return card;
}

let statusWarnings = [];

let settingsData = null;
async function api(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: { "Content-Type": "application/json" },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || "Something went wrong.");
  return data;
}

function fillModels(select, withManage) {
  select.replaceChildren();
  for (const provider of settingsData.providers) {
    if (!provider.configured) continue;
    const group = document.createElement("optgroup");
    group.label = provider.label;
    for (const model of provider.models) {
      const option = el("option", "", model);
      option.value = provider.id + "|" + model;
      option.selected = provider.id === settingsData.provider && model === settingsData.model;
      group.append(option);
    }
    select.append(group);
  }
  if (withManage) {
    const option = el("option", "", "Add or manage keys…");
    option.value = "manage";
    select.append(option);
  }
}

/** A native select is as wide as its longest option, so it is sized to the chosen one instead. */
function fitSelect(select) {
  const probe = el("span", select.className, select.options[select.selectedIndex]?.text ?? "");
  probe.style.cssText = "position:absolute;visibility:hidden;white-space:pre;padding:0;margin:0;background:none";
  document.body.append(probe);
  select.style.width = Math.ceil(probe.getBoundingClientRect().width) + 20 + "px";
  probe.remove();
}

function applySettings(data) {
  const was = configured;
  settingsData = data;
  configured = data.configured;
  statusWarnings = data.warnings || [];
  input.disabled = !configured;
  input.placeholder = configured ? "Ask anything" : "Add an API key to start chatting";
  $("model").hidden = !configured;
  if (configured) { fillModels($("model"), true); fitSelect($("model")); }
  setBusy(Boolean(active));
  updateComposer();
  if (was !== configured && messages.querySelector(".hero")) showEmpty();
}

async function chooseModel(value) {
  const at = value.indexOf("|");
  try {
    applySettings(await api("POST", "/api/settings/model", { provider: value.slice(0, at), model: value.slice(at + 1) }));
  } catch {
    applySettings(settingsData);
  }
}

async function refreshModels() {
  try { applySettings(await api("GET", "/api/settings?refresh=1")); } catch {}
}

$("model").addEventListener("change", (e) => {
  if (e.target.value === "manage") { location.href = "/settings"; return; }
  chooseModel(e.target.value);
});

let active = null;
let viewGen = 0;
const channel = (() => { try { return new BroadcastChannel("mino"); } catch { return null; } })();
const newId = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
const streamUrl = (id, after) => `/api/stream?threadId=${encodeURIComponent(id)}&after=${after}`;

// Bumping the generation orphans any open stream, so its late events cannot land on the next view.
function detach() {
  viewGen++;
  stopSpeaking();
  if (active) {
    clearInterval(active.watch);
    if (active.frame) cancelAnimationFrame(active.frame);
    active.local.abort();
    active = null;
  }
  setBusy(false);
}

function beginStream(view, id, text) {
  const s = { gen: viewGen, threadId: id, view, text, seq: 0, full: "", frame: 0, retries: 0, lastByte: Date.now(), local: new AbortController() };
  // A silent connection (sleep, network change) is dropped and resumed from the last event seen.
  s.watch = setInterval(() => { if (Date.now() - s.lastByte > 40000) s.local.abort(); }, 10000);
  view.answer.classList.add("streaming");
  active = s;
  setBusy(true);
  return s;
}

function paint(s) {
  s.frame = 0;
  const stick = nearBottom();
  s.view.answer.innerHTML = html(s.full);
  if (stick) toBottom();
}

// Hidden tabs do not run animation frames, so painting waits for visibilitychange.
function schedulePaint(s) {
  if (document.hidden || s.frame) return;
  s.frame = requestAnimationFrame(() => paint(s));
}

function addNote(view, text, failed) {
  view.wrap.append(el("div", "stamp mono note" + (failed ? " failed" : ""), text));
}

function finish(s, outcome, message) {
  if (s !== active) return;
  clearInterval(s.watch);
  if (s.frame) cancelAnimationFrame(s.frame);
  s.frame = 0;
  active = null;
  s.view.status.textContent = "";
  s.view.answer.classList.remove("streaming");
  paint(s);
  if (outcome !== "failed" && s.full) addAnswerTools(s.view, s.full);
  if (outcome === "stopped") addNote(s.view, s.full ? "Stopped" : "Stopped before answering");
  if (outcome === "failed") {
    const p = el("p", "failed", message);
    const parent = s.view.wrap;
    parent.append(p);
    if (s.text) {
      const retry = el("button", "ghost mono retry", "Try again");
      retry.type = "button";
      retry.addEventListener("click", () => { parent.previousElementSibling?.remove(); parent.remove(); ask(s.text); });
      parent.append(retry);
    }
  }
  setBusy(false);
  channel?.postMessage({ threadId: s.threadId });
  refreshChats();
  if (!document.hidden && configured) input.focus();
}

/** Applies one event. Sequence numbers make a replay after reconnecting harmless. */
function apply(s, e) {
  if (e.seq <= s.seq) return false;
  s.seq = e.seq;
  s.retries = 0;
  switch (e.type) {
    case "text": s.full += e.text; s.view.status.textContent = ""; schedulePaint(s); break;
    case "search": s.view.status.textContent = "Searching: " + e.query; break;
    case "status": s.view.status.textContent = e.text; break;
    case "sources": renderSources(s.view.sources, e.sources); break;
    case "done": finish(s, "ok"); return true;
    case "stopped": finish(s, "stopped"); return true;
    case "error": finish(s, "failed", e.text); return true;
  }
  return false;
}

async function pump(s, res) {
  const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
  let buffer = "";
  for (;;) {
    const { value, done } = await reader.read();
    if (done || s.gen !== viewGen) return false;
    s.lastByte = Date.now();
    buffer += value;
    const chunks = buffer.split("\n\n");
    buffer = chunks.pop();
    for (const chunk of chunks) {
      if (!chunk.startsWith("data: ")) continue;
      if (apply(s, JSON.parse(chunk.slice(6)))) return true;
    }
  }
}

async function follow(s, first) {
  let res = first;
  for (;;) {
    if (res) {
      let ended = false;
      try { ended = await pump(s, res); } catch {}
      if (ended || s !== active || s.gen !== viewGen) return;
    }
    if (++s.retries > 6) { finish(s, "failed", "Lost connection to the server."); return; }
    s.view.status.textContent = "Reconnecting";
    await sleep(400 * s.retries);
    if (s !== active || s.gen !== viewGen) return;
    s.local = new AbortController();
    s.lastByte = Date.now();
    try {
      res = await fetch(streamUrl(s.threadId, s.seq), { signal: s.local.signal });
    } catch { res = null; continue; }
    if (s !== active || s.gen !== viewGen) return;
    // 204 means the reply ended while disconnected, so the saved turn is the truth.
    if (res.status === 204) { loadThread(s.threadId); return; }
    if (!res.ok) res = null;
  }
}

async function ask(text) {
  if (active || !configured) return;
  messages.querySelector(".hero")?.remove();
  if (!threadId) {
    threadId = newId();
    history.pushState(null, "", "#" + threadId);
    writeThread(threadId);
  }
  const id = threadId;
  addUser(text, Date.now());
  const view = addAnswer();
  view.status.textContent = "Thinking";
  toBottom();
  const s = beginStream(view, id, text);

  let res;
  try {
    res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ threadId: id, message: text, timezone }),
      signal: s.local.signal,
    });
  } catch {
    if (s === active) finish(s, "failed", "Could not reach the server. Is it still running?");
    return;
  }
  if (s !== active) return;
  if (res.status === 409) {
    // Another tab is answering in this chat: keep what was typed and show its reply.
    input.value = text;
    sizeInput();
    loadThread(id);
    return;
  }
  if (!res.ok || !res.body) {
    finish(s, "failed", (await res.text().catch(() => "")) || "The request failed.");
    return;
  }
  channel?.postMessage({ threadId: id });
  refreshChats();
  follow(s, res);
}

function stop() {
  if (!active) return;
  send.disabled = true;
  fetch("/api/stop", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ threadId: active.threadId }),
  }).catch(() => { send.disabled = false; });
}

function renderSaved(t) {
  addUser(t.userText, t.createdAt);
  const view = addAnswer();
  view.answer.innerHTML = html(t.assistantText || "");
  renderSources(view.sources, t.sources);
  if (t.status === "interrupted") addNote(view, t.assistantText ? "Stopped" : "Stopped before answering");
  if (t.status === "failed") addNote(view, "This reply failed", true);
  if (t.assistantText) addAnswerTools(view, t.assistantText);
}

async function loadThread(id, attempt = 0) {
  detach();
  const gen = viewGen;
  threadId = id;
  writeThread(id);
  markActiveChat();
  lastDay = null;
  let turns = [];
  try { turns = await (await fetch("/api/thread?id=" + encodeURIComponent(id))).json(); } catch {}
  if (gen !== viewGen) return;
  messages.replaceChildren();
  if (!turns.length) { showEmpty(); return; }

  const last = turns.at(-1);
  const live = last.status === "streaming" ? last : null;
  for (const t of turns) if (t !== live) renderSaved(t);

  if (live) {
    let res = null;
    try { res = await fetch(streamUrl(id, 0)); } catch {}
    if (gen !== viewGen) { res?.body?.cancel(); return; }
    if (res?.status === 204 && attempt < 2) { loadThread(id, attempt + 1); return; }
    addUser(live.userText, live.createdAt);
    const view = addAnswer();
    view.status.textContent = "Resuming";
    const s = beginStream(view, id, live.userText);
    follow(s, res && res.ok && res.status !== 204 ? res : null);
  }
  toBottom();
}

function setChatsOpen(open) {
  document.body.classList.toggle("chats-open", open);
  try { localStorage.setItem("chatsOpen", open ? "1" : "0"); } catch {}
}

function markActiveChat() {
  for (const row of $("chat-list").querySelectorAll(".chat-row")) {
    row.classList.toggle("active", row.dataset.id === threadId);
  }
}

async function togglePin(chat) {
  try { await api("PATCH", "/api/thread", { threadId: chat.threadId, pinned: !chat.pinned }); } catch {}
  channel?.postMessage({ chats: true });
  await refreshChats();
  $("chat-list").querySelector(`[data-id="${CSS.escape(chat.threadId)}"] .pin`)?.focus();
}

function leaveDeletedChat() {
  history.replaceState(null, "", location.pathname);
  goHome();
}

async function deleteChat(id) {
  await api("DELETE", "/api/thread", { threadId: id });
  channel?.postMessage({ threadId: id, deleted: true });
  if (id === threadId) {
    leaveDeletedChat();
    if (configured) input.focus();
  }
  refreshChats();
}

// Deleting is permanent, so the row asks first. Only one row can be asking at a time.
let closeConfirm = null;
function askDelete(chat, row, trigger) {
  closeConfirm?.();
  const original = [...row.children];
  const box = el("div", "chat-confirm");
  const text = el("span", "", "Delete?");
  const cancel = el("button", "ghost mono", "Cancel");
  const confirm = el("button", "ghost mono delete", "Delete");
  cancel.type = confirm.type = "button";
  confirm.title = "Permanently deletes this chat and removes it from Mino's memory";
  const close = () => { closeConfirm = null; row.replaceChildren(...original); };
  closeConfirm = close;
  cancel.addEventListener("click", () => { close(); trigger.focus(); });
  confirm.addEventListener("click", async () => {
    confirm.disabled = cancel.disabled = true;
    try { await deleteChat(chat.threadId); }
    catch {
      text.textContent = "Failed";
      text.classList.add("failed");
      confirm.disabled = cancel.disabled = false;
    }
  });
  box.addEventListener("keydown", (e) => { if (e.key === "Escape") cancel.click(); });
  box.append(text, cancel, confirm);
  row.replaceChildren(box);
  cancel.focus();
}

function chatRow(chat) {
  const row = el("div", "chat-row");
  row.dataset.id = chat.threadId;
  const item = el("button", "chat-item", chat.title);
  item.type = "button";
  item.title = chat.title;
  item.addEventListener("click", () => {
    if (window.innerWidth < 900) setChatsOpen(false);
    if (chat.threadId === threadId) return;
    history.pushState(null, "", "#" + chat.threadId);
    loadThread(chat.threadId);
  });
  const pin = toolButton(ICONS.pin, chat.pinned ? "Unpin chat" : "Pin chat");
  pin.classList.add("pin");
  pin.classList.toggle("on", chat.pinned);
  pin.addEventListener("click", () => togglePin(chat));
  const remove = toolButton(ICONS.trash, "Delete chat");
  remove.addEventListener("click", () => askDelete(chat, row, remove));
  const actions = el("div", "chat-actions");
  actions.append(pin, remove);
  row.append(item, actions);
  return row;
}

let chatsGen = 0;
async function refreshChats() {
  const gen = ++chatsGen;
  let chats = [];
  try { chats = await (await fetch("/api/threads")).json(); } catch { return; }
  // A slower, older response must not bring back a chat that was just deleted.
  if (gen !== chatsGen) return;
  closeConfirm = null;
  const list = $("chat-list");
  list.replaceChildren();
  if (!chats.length) { list.append(el("div", "chats-empty", "Your chats will appear here")); return; }
  let section = null;
  for (const chat of chats) {
    const label = chat.pinned ? "Pinned" : dayLabel(chat.updatedAt);
    if (label !== section) { section = label; list.append(el("div", "mono chats-day", label)); }
    list.append(chatRow(chat));
  }
  markActiveChat();
}

function goHome() {
  detach();
  threadId = null;
  writeThread(null);
  markActiveChat();
  showEmpty();
}

$("form").addEventListener("submit", (e) => {
  e.preventDefault();
  if (active) { stop(); return; }
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  sizeInput();
  ask(text);
});
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("form").requestSubmit(); }
});
input.addEventListener("input", () => { sizeInput(); setBusy(Boolean(active)); updateComposer(); });
$("new").addEventListener("click", () => {
  history.pushState(null, "", location.pathname);
  goHome();
  input.focus();
});
window.addEventListener("popstate", () => {
  const id = location.hash.slice(1);
  if (id) loadThread(id); else goHome();
});
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && active) { if (active.frame) cancelAnimationFrame(active.frame); paint(active); }
});
if (channel) channel.onmessage = (e) => {
  refreshChats();
  if (e.data.threadId !== threadId) return;
  if (e.data.deleted) leaveDeletedChat();
  else if (!active) loadThread(threadId);
};
$("chats-toggle").addEventListener("click", () => setChatsOpen(!document.body.classList.contains("chats-open")));
$("chats-backdrop").addEventListener("click", () => setChatsOpen(false));

(async () => {
  tickClock();
  setInterval(tickClock, 15000);
  let savedOpen = null;
  try { savedOpen = localStorage.getItem("chatsOpen"); } catch {}
  document.body.classList.toggle("chats-open", window.innerWidth >= 900 && savedOpen !== "0");
  refreshChats();
  try { applySettings(await api("GET", "/api/settings")); refreshModels(); }
  catch { configured = false; }

  const id = location.hash.slice(1) || threadId;
  if (id) {
    history.replaceState(null, "", "#" + id);
    await loadThread(id);
  } else {
    showEmpty();
  }
  setBusy(Boolean(active));
  if (configured) input.focus();
  updateComposer();
})();
</script>
</body>
</html>
